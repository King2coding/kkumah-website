<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2365 1560" role="img" aria-labelledby="title description">
  <title id="title">GPCP V3.3 Global Surface Precipitation Climatology</title>
  <desc id="description">Total liquid and frozen precipitation climatology for January 1992 through December 2023 on a 288 by 180 grid, with a discrete legend in millimeters per day.</desc>
  <defs>
    <clipPath id="title-block">
      <rect width="2365" height="165" />
    </clipPath>
    <clipPath id="map-and-legend">
      <rect y="165" width="2365" height="1395" />
    </clipPath>
  </defs>
  <rect width="2365" height="1560" fill="#ffffff" />
  <image xlink:href="gpcp-v3.3-climatology-source.png" width="2365" height="1670" clip-path="url(#title-block)" />
  <image xlink:href="gpcp-v3.3-climatology-source.png" y="-110" width="2365" height="1670" clip-path="url(#map-and-legend)" />
  <rect x="145" y="1060" width="190" height="125" fill="#ffffff" />
</svg>
